<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treaty</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #d9d9d3;
  --ring-domain: #eef1f6; --ring-app: #f4f5f8; --ring-adapter: #fafafa; --ring-outer: #fdfdfc; --ring-stroke: #c9ccd4;
  --module: #ffffff; --module-stroke: #8a8f99; --hex-stroke: #c9ccd3; --group: rgba(120, 130, 150, .06); --group-collapsed: rgba(120, 130, 150, .16); --edge: #7f93bd; --arrow: #3f4654;
  --blue: #2563eb; --orange: #d97706; --magenta: #c026d3; --teal: #0d9488; --yellow: #a16207; --high: #dc2626; --medium: #d97706; --low: #6b7280;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --panel: #1d1d1b; --ink: #ececea; --muted: #9b9b95; --line: #34342f;
    --ring-domain: #1f2430; --ring-app: #1c1f27; --ring-adapter: #1a1b1f; --ring-outer: #18181b; --ring-stroke: #3b3f4a;
    --module: #23232a; --module-stroke: #7d828c; --hex-stroke: #454a55; --group: rgba(160, 170, 195, .05); --group-collapsed: rgba(160, 170, 195, .14); --edge: #5f7196; --arrow: #d4d7dd;
    --blue: #60a5fa; --orange: #f59e0b; --magenta: #e879f9; --teal: #2dd4bf; --yellow: #facc15; --high: #f87171; --medium: #fbbf24; --low: #9ca3af;
    --code-bg: #25251f; --focus: #60a5fa; --glow: rgba(147, 197, 253, .95);
  }
}
:root[data-theme="dark"] {
  --bg: #141413; --panel: #1d1d1b; --ink: #ececea; --muted: #9b9b95; --line: #34342f;
  --ring-domain: #1f2430; --ring-app: #1c1f27; --ring-adapter: #1a1b1f; --ring-outer: #18181b; --ring-stroke: #3b3f4a;
  --module: #23232a; --module-stroke: #7d828c; --hex-stroke: #454a55; --group: rgba(160, 170, 195, .05); --group-collapsed: rgba(160, 170, 195, .14); --edge: #5f7196; --arrow: #d4d7dd;
  --blue: #60a5fa; --orange: #f59e0b; --magenta: #e879f9; --teal: #2dd4bf; --yellow: #facc15; --high: #f87171; --medium: #fbbf24; --low: #9ca3af;
  --code-bg: #25251f; --focus: #60a5fa; --glow: rgba(147, 197, 253, .95);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; height: 100vh; }
header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; }
header .meta { color: var(--muted); font-size: 12px; }
header .spacer { flex: 1; }
header .live { display: flex; align-items: center; gap: 6px; font-size: 12px; }
header .live[hidden] { display: none; }
header select, header input { font: inherit; font-size: 12px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
header input[hidden] { display: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--low); }
.dot.on { background: var(--teal); } .dot.error { background: var(--high); }
.status { color: var(--muted); } .status.error { color: var(--high); }
.adopt { color: var(--teal); display: inline-flex; gap: 6px; align-items: center; } .adopt[hidden] { display: none; }
.offer { position: absolute; left: 10px; bottom: 10px; max-width: min(420px, calc(100% - 70px)); background: var(--panel); border: 1px solid var(--teal); border-left-width: 4px; border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.25); display: grid; gap: 6px; }
.offer[hidden] { display: none; }
.offer .who { color: var(--teal); font-weight: 600; }
.offer .why { color: var(--muted); }
.offer .actions { display: flex; gap: 6px; }
/* Selection glows yellow and Claude's show requests glow teal. Both pulse
   unless the person prefers reduced motion. */
.selected-glow { filter: drop-shadow(0 0 3px var(--yellow)) drop-shadow(0 0 7px var(--yellow)); }
.pointed-glow { filter: drop-shadow(0 0 3px var(--teal)) drop-shadow(0 0 8px var(--teal)); }
.selected-label { fill: var(--yellow) !important; font-weight: 700; }
@media (prefers-reduced-motion: no-preference) {
  .selected-glow { animation: selected-pulse 1.6s ease-in-out infinite; }
  .pointed-glow { animation: pointed-pulse 1.1s ease-in-out infinite; }
  @keyframes selected-pulse { 0%, 100% { filter: drop-shadow(0 0 1px var(--yellow)); } 50% { filter: drop-shadow(0 0 4px var(--yellow)) drop-shadow(0 0 10px var(--yellow)); } }
  @keyframes pointed-pulse { 0%, 100% { filter: drop-shadow(0 0 1px var(--teal)); } 50% { filter: drop-shadow(0 0 5px var(--teal)) drop-shadow(0 0 12px var(--teal)); } }
}
header label, header button { font-size: 12px; color: var(--ink); }
button { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; color: var(--ink); }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
main { display: grid; grid-template-columns: 300px minmax(0, 1fr) 360px; flex: 1; min-height: 0; }
aside { overflow: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 12px; }
aside.inspector { border-right: 0; border-left: 1px solid var(--line); }
h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 4px 0 10px; }
.queue-item { display: grid; grid-template-columns: 22px 1fr; gap: 6px; padding: 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
.queue-item:hover { background: var(--bg); }
.queue-item.active { border-color: var(--focus); background: var(--bg); }
.queue-item .title { font-weight: 600; word-break: break-word; }
.queue-item .detail { color: var(--muted); font-size: 12px; word-break: break-word; }
.sev { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; margin-top: 2px; }
.sev.high { background: var(--high); } .sev.medium { background: var(--medium); border-radius: 3px; } .sev.low { background: var(--low); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
#map { width: 100%; height: 100%; display: block; }
.map-wrap { position: relative; overflow: hidden; }
.glow { filter: drop-shadow(0 0 3px var(--glow)) drop-shadow(0 0 7px var(--glow)); }
.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: 12px/1.3 ui-monospace, "SF Mono", Menlo, monospace; box-shadow: 0 2px 8px rgba(0,0,0,.25); max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: none; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 32px; height: 32px; padding: 0; font-size: 16px; background: var(--panel); }
#map { cursor: grab; touch-action: none; } #map.panning { cursor: grabbing; }
/* Dragging pans the map; it must never select labels, legend text or tooltips. */
.map-wrap { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
/* A browser focus ring on an SVG element is a box around its bounds. The map
   shows selection with its own stroke, and keyboard focus with the glow. */
#map :focus, #map :focus-visible { outline: none; }
.legend { position: absolute; left: 10px; top: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 11px; color: var(--muted); }
.legend svg { vertical-align: middle; }
.ring-label { font-size: 10px; fill: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.module-label { font-size: 10px; fill: var(--ink); pointer-events: none; }
.group { cursor: pointer; }
.group-name { font-size: 11px; font-weight: 600; fill: var(--muted); pointer-events: none; }
.group-count { font-size: 10px; fill: var(--muted); pointer-events: none; }
.module { cursor: pointer; }
.dim { opacity: .18; }
.inspector dl { display: grid; grid-template-columns: 90px 1fr; gap: 4px 8px; margin: 0 0 12px; font-size: 13px; }
.inspector dt { color: var(--muted); }
.inspector dd { margin: 0; word-break: break-word; }
pre { background: var(--code-bg); padding: 8px; border-radius: 6px; overflow: auto; font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; margin: 0 0 12px; }
.sig-old { color: var(--high); } .sig-new { color: var(--blue); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
.chip { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; cursor: pointer; background: var(--bg); color: var(--ink); }
table.metrics { border-collapse: collapse; width: 100%; font-size: 12px; margin-bottom: 12px; }
table.metrics td, table.metrics th { border-bottom: 1px solid var(--line); padding: 3px 4px; text-align: right; }
table.metrics td:first-child, table.metrics th:first-child { text-align: left; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.pill.fail { background: var(--high); color: #fff; } .pill.pass { background: var(--blue); color: #fff; }
.empty { color: var(--muted); }
.slice-head { display: flex; justify-content: space-between; align-items: center; }
@media (max-width: 900px) {
  body { height: auto; }
  main { grid-template-columns: 1fr; }
  aside { border: 0; border-bottom: 1px solid var(--line); max-height: none; }
  .map-wrap { height: 70vh; }
}
@media (prefers-reduced-motion: no-preference) { .queue-item, .chip { transition: background .12s; } }
</style>
</head>
<body>
<header>
  <h1>Treaty</h1>
  <span class="meta" id="meta"></span>
  <span class="live" id="live" hidden>
    <span class="dot" id="live-dot" aria-hidden="true"></span>
    <label>Baseline <select id="baseline-mode"><option value="head">HEAD</option><option value="pr">Pull request</option><option value="ref">Ref</option></select></label>
    <input id="baseline-arg" type="text" size="16" spellcheck="false" aria-label="Baseline ref or target branch">
    <button id="baseline-apply" type="button">Apply</button>
    <label title="Preview the code in another architecture; treaty.yaml switches after 5 minutes or when you choose to use it">Architecture <select id="architecture"><option value="hexagonal">Hexagonal</option><option value="clean">Clean</option><option value="layered">Layered</option><option value="slices">Vertical slices</option><option value="modular">Modular monolith</option></select></label>
    <span class="adopt" id="adopt-bar" role="status" hidden>treaty.yaml switches in <span id="adopt-countdown"></span> <button id="adopt" type="button">Use this architecture</button> <button id="adopt-cancel" type="button">Keep treaty.yaml</button></span>
    <span class="status" id="status" role="status"></span>
    <label title="When on, Claude's show requests move the view, but only while you are not using the map"><input type="checkbox" id="follow"> Follow Claude</label>
  </span>
  <span class="spacer"></span>
  <label><input type="checkbox" id="internals"> Show internals</label>
  <button id="theme" type="button" aria-label="Toggle theme">Theme</button>
</header>
<main>
  <aside aria-label="Review queue"><h2>Review queue</h2><div id="queue"></div></aside>
  <div class="map-wrap">
    <svg id="map" role="application" aria-label="Hexagon map of modules and contracts"></svg>
    <div class="legend" id="legend"></div>
    <div class="tip" id="tip" role="tooltip"></div>
    <div class="offer" id="offer" role="status" aria-live="polite" hidden>
      <div><span class="who" id="offer-who"></span> <span id="offer-what"></span></div>
      <div class="why" id="offer-why"></div>
      <div class="actions"><button type="button" id="offer-go">Go</button><button type="button" id="offer-dismiss">Dismiss</button></div>
    </div>
    <div class="zoom" role="group" aria-label="Zoom">
      <button type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in (+)">+</button>
      <button type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out (−)">−</button>
      <button type="button" id="zoom-fit" aria-label="Fit to view" title="Fit (0)">⤢</button>
    </div>
  </div>
  <aside class="inspector" aria-label="Inspector"><h2>Inspector</h2><div id="inspector"><p class="empty">Select a module, symbol, edge or queue item.</p></div></aside>
</main>
<script>
let D = /*DATA*/null;
// With no data embedded, the page is the live map: it loads the view from the
// server that served it and redraws on every rebuild.
const LIVE = D === null;

// ingest indexes one view. Everything drawn is derived from D and these maps.
function ingest(data) {
  D = data;
  for (const key of ["modules", "symbols", "edges", "links", "findings", "designs", "problems"]) D[key] = D[key] || [];
  modules = new Map(D.modules.map(m => [m.id, m]));
  symbols = new Map(D.symbols.map(s => [s.id, s]));
  byModule = new Map();
  for (const s of D.symbols) { if (!byModule.has(s.module)) byModule.set(s.module, []); byModule.get(s.module).push(s); }
  edges = D.edges; links = D.links;
  const note = document.getElementById("legend-public");
  if (note) note.hidden = D.architecture !== "modular";
  groups = new Map((D.layout.groups || []).map(g => [g.id, g]));
  groupOf = new Map();
  for (const g of D.layout.groups || []) for (const id of g.modules) if (!groupOf.has(id) || groups.get(groupOf.get(id)).depth < g.depth) groupOf.set(id, g.id);
}
const NS = "http://www.w3.org/2000/svg";
const ICON_GROWTH = 0.4;
const inherits = kind => kind === "implements" || kind === "embeds";
const HIT_SLOP = 12;
const AUTO_COLLAPSE_PX = 45;
const LABEL_MIN_PX = 9;
const state = { pointer: null, selected: null, internals: false, symbolPos: new Map(), view: null, groupOpen: {}, signature: undefined, rendering: false };
const home = () => { const E = D.layout.extent + 20; return { x: -E, y: -E, w: 2 * E, h: 2 * E }; };

  // so they neither crowd each other nor vanish as the map grows.

  // fitted view however large the map is; icons stay tied to the geometry.
  const rect = svg.getBoundingClientRect(), fitted = Math.min(rect.width / home().w, rect.height / home().h) || 1;
  const boost = Math.max(1, LABEL_MIN_PX / (10 * fitted));

  const w = Math.min(limit * 3, Math.max(limit * 0.05, v.w * factor)), scale = w / v.w;

function color(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function glyph(change) { return { added: "+", contract: "Δ", breaking: "!", removed: "−", implementation: "~", moved: "→" }[change] || ""; }

// circle function, filled circle method, hollow square interface, filled
// square concrete type, filled triangle value. Color shows the change (grey
// unchanged, blue added, orange changed), with a glyph beside the icon.
// Designed or planned symbols that are not built yet are teal with a dashed
// outline, so the state never relies on color alone.
function drawShape(g, kind, x, y, r, change, design) {
  const hue = change === "added" ? color("--blue") : change ? color("--orange") : color("--module-stroke");
  const hollow = kind === "function" || kind === "interface";
  const common = { fill: hollow ? color("--module") : hue, stroke: hue, "stroke-width": hollow ? 1.6 : 1 };

// Groups are directories drawn as hexagons around their packages. They are

function pixelsPerUnit() { const rect = document.getElementById("map").getBoundingClientRect(); const v = state.view || home(); return Math.min(rect.width / v.w, rect.height / v.h) || 1; }
function isCollapsed(g) {

// anchorOf is where a module shows on the map: itself, or the outermost

function collapsedSignature() { return (D.layout.groups || []).filter(isCollapsed).map(g => g.id).join("|"); }
// placeName says where the architecture puts a module: its slice or

function placeName(m) {

// moduleLabel names a module relative to the group drawn around it, so a

}

function related() {

  } else if (sel.type === "module") {
    set.add(sel.id); for (const s of byModule.get(sel.id) || []) set.add(s.id);
    for (const e of edges) if (e.from === sel.id || e.to === sel.id) { set.add(e.from); set.add(e.to); }

  document.querySelectorAll(".queue-item").forEach(node => {
    const targets = JSON.parse(node.dataset.targets); const sel = state.selected;
    node.classList.toggle("active", !!sel && (targets.includes(sel.id) || (sel.type === "edge" && targets.includes(sel.from) && targets.includes(sel.to))));
  });
}
function buildQueue() {
  const q = document.getElementById("queue"); q.innerHTML = "";
  if (!D.findings.length) { q.appendChild(h("p", { class: "empty" }, "Nothing to review.")); return; }
  for (const f of D.findings) {
    const item = h("div", { class: "queue-item", tabindex: 0, role: "button" }); item.dataset.targets = JSON.stringify(f.targets);
    item.appendChild(h("span", { class: "sev " + f.severity, "aria-label": f.severity }, f.severity === "high" ? "!" : ""));
    const body = h("div"); body.appendChild(h("div", { class: "title" }, f.title)); body.appendChild(h("div", { class: "detail" }, f.detail)); item.appendChild(body);
    const pick = () => {
      const t = f.targets;
      if (f.kind === "layer_violation") { const e = edges.find(x => x.from === t[0] && x.to === t[1]); if (e) return select({ type: "edge", from: e.from, to: e.to, edge: e }); }
      if (symbols.has(t[0])) return select({ type: "symbol", id: t[0] });
      if (modules.has(t[0])) return select({ type: "module", id: t[0] });
    };
    item.addEventListener("click", pick); item.addEventListener("keydown", ev => { if (ev_is(ev)) { ev.preventDefault(); pick(); } });
    q.appendChild(item);
  }
}
function buildLegend() {
  const legend = document.getElementById("legend");
  const shapes = [["function", "function"], ["method", "method"], ["interface", "interface"], ["type", "concrete type"], ["value", "value"]];
  for (const [kind, label] of shapes) {
    const svg = el("svg", { width: 14, height: 14, viewBox: "-7 -7 14 14" }); drawShape(svg, kind, 0, 0, 5, "", false);
    const span = h("span"); span.appendChild(svg); span.appendChild(document.createTextNode(" " + label + "  ")); legend.appendChild(span);
  }
  legend.appendChild(h("br"));
  legend.appendChild(document.createTextNode("blue + added · orange Δ compatible, ! breaking, ~ implementation, → moved · teal dashed = planned, not built"));
  legend.appendChild(h("br"));
  legend.appendChild(document.createTextNode("solid ▶ uses · dashed ▷ implements or embeds · magenta ! = rule violation · double hexagon = composition"));
  // The legend is built before a live map has its data, so ingest shows this
  // note once it knows the architecture.
  legend.appendChild(h("span", { id: "legend-public", hidden: "" }, " · bold outline = public API"));
}
function updateMeta() {
  const meta = `${D.modules.length} modules · ${D.symbols.filter(s => s.contract).length} contracts · ${D.findings.length} findings`;
  document.getElementById("meta").textContent = LIVE ? meta : meta + (D.base ? " · base " + D.base : "");
}
document.getElementById("internals").addEventListener("change", ev => { state.internals = ev.target.checked; render(); });
document.getElementById("theme").addEventListener("click", () => {
  const root = document.documentElement; const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark"; render();
});
const mapEl = document.getElementById("map");
let drag = null;
mapEl.addEventListener("wheel", ev => {
  ev.preventDefault();
  const step = ev.deltaMode === 1 ? ev.deltaY * 16 : ev.deltaY;
  zoom(Math.exp(step * (ev.ctrlKey ? 0.01 : 0.0015)), toMap(ev.clientX, ev.clientY));
}, { passive: false });
mapEl.closest(".map-wrap").addEventListener("selectstart", ev => ev.preventDefault());
mapEl.addEventListener("pointerdown", ev => {
  if (ev.button !== 0) return;
  drag = { x: ev.clientX, y: ev.clientY, view: { ...state.view }, moved: false, target: ev.target };
});
window.addEventListener("pointermove", ev => {
  if (!drag) return;
  const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  if (!drag.moved) { drag.moved = true; mapEl.classList.add("panning"); mapEl.setPointerCapture?.(ev.pointerId); }
  const rect = mapEl.getBoundingClientRect(), scale = Math.max(drag.view.w / rect.width, drag.view.h / rect.height);
  state.view = { ...drag.view, x: drag.view.x - dx * scale, y: drag.view.y - dy * scale };
  applyView();
});
window.addEventListener("pointerup", () => {
  if (drag && drag.moved) { const swallow = e => { e.stopPropagation(); window.removeEventListener("click", swallow, true); }; window.addEventListener("click", swallow, true); setTimeout(() => window.removeEventListener("click", swallow, true), 0); }
  drag = null; mapEl.classList.remove("panning");
});
// nearestSymbol finds the symbol closest to a screen point within HIT_SLOP
// pixels, so selection does not need pixel-perfect aim.
function nearestSymbol(clientX, clientY) {
  const m = mapEl.getScreenCTM(); if (!m) return null;
  let best = null, bestDistance = HIT_SLOP;
  for (const [id, [x, y]] of state.symbolPos) {
    const distance = Math.hypot(m.a * x + m.c * y + m.e - clientX, m.b * x + m.d * y + m.f - clientY);
    if (distance <= bestDistance) { best = id; bestDistance = distance; }
  }

  return best;
}
function symbolElement(id) { return id ? mapEl.querySelector(`[data-symbol="${CSS.escape(id)}"]`) : null; }
mapEl.addEventListener("click", ev => {
  const nearest = nearestSymbol(ev.clientX, ev.clientY);
  if (nearest) { ev.stopPropagation(); select({ type: "symbol", id: nearest }); return; }
  if (ev.target === mapEl || (ev.target.tagName === "polygon" && ev.target.parentNode === mapEl)) select(null);
}, true);
// setGlow lights up the thing under the pointer: a symbol's icon, a module's
// hexagon outline, or the visible line behind an edge's wider hit strip.
let glowing = null;
function setGlow(target) {
  let node = target;
  if (node && node.glowTarget) node = node.glowTarget;
  else if (node && node.classList && (node.classList.contains("module") || node.classList.contains("group"))) node = node.querySelector("polygon");
  if (node === glowing) return;
  if (glowing) glowing.classList.remove("glow");
  glowing = node && node.isConnected ? node : null;
  if (glowing) glowing.classList.add("glow");
}
const tip = document.getElementById("tip");
mapEl.addEventListener("pointermove", ev => {
  const target = drag && drag.moved ? null : symbolElement(nearestSymbol(ev.clientX, ev.clientY)) || (ev.target.closest && ev.target.closest("[data-label]"));
  mapEl.style.cursor = target ? "pointer" : "";
  setGlow(target);
  if (!target) { tip.style.display = "none"; return; }
  tip.textContent = target.dataset.label;
  tip.style.display = "block";
  const x = Math.min(ev.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
  tip.style.left = `${x}px`; tip.style.top = `${ev.clientY + 16}px`;
});
mapEl.addEventListener("pointerleave", () => { tip.style.display = "none"; setGlow(null); });
mapEl.addEventListener("focusin", ev => {
  const target = ev.target.closest && ev.target.closest("[data-label]"); if (!target || !ev.target.matches(":focus-visible")) return;
  setGlow(target);
  const box = target.getBoundingClientRect();
  tip.textContent = target.dataset.label; tip.style.display = "block";
  tip.style.left = `${box.right + 6}px`; tip.style.top = `${box.bottom + 6}px`;
});
mapEl.addEventListener("focusout", () => { tip.style.display = "none"; setGlow(null); });
document.getElementById("zoom-in").addEventListener("click", () => zoom(1 / 1.4));
document.getElementById("zoom-out").addEventListener("click", () => zoom(1.4));
document.getElementById("zoom-fit").addEventListener("click", () => { state.view = home(); applyView(); });
window.addEventListener("keydown", ev => {
  if (["INPUT", "SELECT", "TEXTAREA"].includes(ev.target.tagName) || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (ev.key === "+" || ev.key === "=") zoom(1 / 1.4);
  else if (ev.key === "-" || ev.key === "_") zoom(1.4);
  else if (ev.key === "0") { state.view = home(); applyView(); }
});
function selectFromHash() {
  if (location.hash.length <= 1) return;
  const id = decodeURIComponent(location.hash.slice(1));
  if (symbols.has(id)) select({ type: "symbol", id }); else if (modules.has(id)) select({ type: "module", id });
}

// Live map. The server pushes its state after every rebuild; a new version
// means a new view to fetch. The view stays anchored to the selection: if the
// selected item moves in the new layout, the camera moves with it, so it
// stays where it was on screen. With nothing selected, the camera stays put.
const live = { shown: -1, loading: false, pending: null, state: null, pointerSeen: 0 };

// Claude's show requests. An offer never moves the view on its own: the item
// pulses and a notice lets the person jump to it. With "Follow Claude" on,
// the view moves, but only after the person has left the map alone for
// FOLLOW_IDLE_MS; otherwise it is an offer like any other.
const FOLLOW_IDLE_MS = 4000, OFFER_MS = 20000, PULSE_MS = 6000;
let lastInteraction = 0, offerTimer = null, offered = null;
for (const type of ["pointerdown", "pointermove", "wheel", "keydown"]) window.addEventListener(type, () => { lastInteraction = Date.now(); }, { passive: true, capture: true });
function pointerPosition(target) {
  const s = symbols.get(target), moduleId = s ? s.module : target;
  const at = s && state.symbolPos.get(target);
  if (at) return { x: at[0], y: at[1] };
  const a = anchorOf(moduleId);
  return a && { x: a.x, y: a.y };
}
// goTo centers the view on a target, zooming in close enough to read its
// module, but never zooming out.
function goTo(target) {
  const s = symbols.get(target), moduleId = s ? s.module : target;
  openAncestors(moduleId); render();
  const at = pointerPosition(target); if (!at) return;
  const close = D.layout.size * (s ? 9 : 14), v = state.view;
  const w = Math.min(v.w, close), h = v.h * w / v.w;
  state.view = { x: at.x - w / 2, y: at.y - h / 2, w, h }; applyView();
}
function offer(pointer) {
  const s = symbols.get(pointer.target), m = modules.get(pointer.target);
  if (!s && !m) return;
  const name = s ? s.name : m.label || m.path;
  state.pointer = { target: pointer.target, until: Date.now() + PULSE_MS };
  render(); setTimeout(render, PULSE_MS + 50);
  const follow = document.getElementById("follow").checked;
  const idle = Date.now() - lastInteraction >= FOLLOW_IDLE_MS && !drag;
  const moved = follow && idle;
  if (moved) goTo(pointer.target);
  offered = pointer.target;
  document.getElementById("offer-who").textContent = moved ? "Claude moved the view to" : "Claude points at";
  document.getElementById("offer-what").textContent = name;
  document.getElementById("offer-why").textContent = pointer.reason || "";
  document.getElementById("offer-go").hidden = moved;
  document.getElementById("offer").hidden = false;
  clearTimeout(offerTimer); offerTimer = setTimeout(dismissOffer, OFFER_MS);
}
function dismissOffer() { document.getElementById("offer").hidden = true; clearTimeout(offerTimer); offered = null; }
function positionOf(sel) {
  if (!sel) return null;
  if (sel.type === "module") { const a = anchorOf(sel.id); return a && { x: a.x, y: a.y }; }
  if (sel.type === "group") { const g = groups.get(sel.id); return g && { x: g.x, y: g.y }; }
  if (sel.type === "symbol") { const at = state.symbolPos.get(sel.id); if (at) return { x: at[0], y: at[1] }; const s = symbols.get(sel.id), a = s && anchorOf(s.module); return a && { x: a.x, y: a.y }; }
  if (sel.type === "edge") { const a = anchorOf(sel.from), b = anchorOf(sel.to); return a && b && { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }; }
  return null;
}
function stillExists(sel) {
  if (!sel) return false;
  if (sel.type === "symbol") return symbols.has(sel.id);
  if (sel.type === "module") return modules.has(sel.id);
  if (sel.type === "group") return groups.has(sel.id);
  if (sel.type === "edge") { const e = edges.find(x => x.from === sel.from && x.to === sel.to); if (e) sel.edge = e; return !!e; }
  return false;
}
function applyUpdate(data) {
  const first = D === null;
  const before = first ? null : positionOf(state.selected);
  ingest(data);
  if (state.selected && !stillExists(state.selected)) { state.selected = null; postSelection(null); }
  updateMeta(); buildQueue(); render();
  const after = positionOf(state.selected);
  if (before && after && state.view) { state.view = { ...state.view, x: state.view.x + after.x - before.x, y: state.view.y + after.y - before.y }; applyView(); }
  inspect(); highlightQueue();
  const problems = D.problems.join(" · ");
  if (problems) setStatus(problems, true);
  if (first) selectFromHash();
}
async function refreshView() {
  if (live.loading) { live.pending = true; return; }
  live.loading = true;
  try {
    const response = await fetch("/api/view", { cache: "no-store" });
    if (!response.ok) throw new Error(await response.text());
    const version = Number(response.headers.get("X-Treaty-Version"));
    const data = await response.json();
    live.shown = version; applyUpdate(data);
  } catch (err) {
    setStatus(`could not load the map: ${err.message}`, true);
  } finally {
    live.loading = false;
    if (live.pending) { live.pending = false; if (live.state && live.state.version !== live.shown) refreshView(); }
  }
}
function setStatus(text, error) {
  const status = document.getElementById("status");
  status.textContent = text; status.classList.toggle("error", !!error);
}
function showState(st) {
  const firstState = live.state === null;
  live.state = st;
  if (st.pointer && st.pointer.sequence > live.pointerSeen) {
    live.pointerSeen = st.pointer.sequence;
    // A pointer made before this page opened is old news; don't replay it.
    if (!firstState) offer(st.pointer);
  }
  const dot = document.getElementById("live-dot");
  dot.classList.toggle("on", !st.error); dot.classList.toggle("error", !!st.error);
  dot.title = st.error ? "build failed" : "live";
  setStatus(st.error ? `build failed, showing the last good map: ${st.error}` : st.baseline.label || "", !!st.error);
  const mode = document.getElementById("baseline-mode"), arg = document.getElementById("baseline-arg");
  if (![mode, arg].includes(document.activeElement)) {
    mode.value = st.baseline.mode || "head";
    arg.value = st.baseline.mode === "pr" ? st.baseline.target || "" : st.baseline.ref || "";
    syncBaselineInput();
  }

}
// showView reflects which architecture the map draws: treaty.yaml's, or a
// preview counting down to replacing it.
function showView(view) {
  if (!view || !view.configured) return;
  const select = document.getElementById("architecture");
  for (const option of select.options) option.textContent = option.textContent.replace(/ \(treaty\.yaml\)$/, "") + (option.value === view.configured ? " (treaty.yaml)" : "");
  if (document.activeElement !== select) select.value = view.architecture;

}
function tickAdopt() {
  const view = live.state && live.state.view;
  if (!view || !view.adopt_at) return;
  const left = Math.max(0, Math.round((Date.parse(view.adopt_at) - Date.now()) / 1000));
  document.getElementById("adopt-countdown").textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;

async function postView(path, body, failure) {
  try {
    const response = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!response.ok) throw new Error((await response.text()).trim());
    showState(await response.json());
  } catch (err) {
    setStatus(`${failure}: ${err.message}`, true);
  }
}
function syncBaselineInput() {
  const mode = document.getElementById("baseline-mode").value, arg = document.getElementById("baseline-arg");
  arg.hidden = mode === "head";
  arg.placeholder = mode === "pr" ? "target (default branch)" : "ref, such as HEAD~3";
}
async function applyBaseline() {
  const mode = document.getElementById("baseline-mode").value, arg = document.getElementById("baseline-arg").value.trim();
  const body = mode === "pr" ? { mode, target: arg } : mode === "ref" ? { mode, ref: arg } : { mode };
  setStatus("switching baseline…");
  try {
    const response = await fetch("/api/baseline", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!response.ok) throw new Error((await response.text()).trim());
    document.getElementById("baseline-apply").blur();
    showState(await response.json());
  } catch (err) {
    setStatus(`baseline not changed: ${err.message}`, true);
  }
}
function postSelection(sel) {
  if (!LIVE) return;
  const body = sel ? { type: sel.type, id: sel.id || "", from: sel.from || "", to: sel.to || "" } : {};
  fetch("/api/selection", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).catch(() => {});
}
function startLive() {
  document.getElementById("live").hidden = false;
  const follow = document.getElementById("follow");
  try { follow.checked = localStorage.getItem("treaty.follow") === "1"; } catch (err) { /* storage unavailable */ }
  follow.addEventListener("change", () => { try { localStorage.setItem("treaty.follow", follow.checked ? "1" : "0"); } catch (err) { /* storage unavailable */ } });
  document.getElementById("offer-go").addEventListener("click", () => {
    const target = offered; dismissOffer(); if (!target) return;
    goTo(target); select(symbols.has(target) ? { type: "symbol", id: target } : { type: "module", id: target });
  });
  document.getElementById("offer-dismiss").addEventListener("click", dismissOffer);
  window.addEventListener("keydown", ev => { if (ev.key === "Escape" && !document.getElementById("offer").hidden) dismissOffer(); });
  document.getElementById("baseline-mode").addEventListener("change", syncBaselineInput);
  document.getElementById("baseline-apply").addEventListener("click", applyBaseline);
  document.getElementById("baseline-arg").addEventListener("keydown", ev => { if (ev.key === "Enter") applyBaseline(); });
  document.getElementById("architecture").addEventListener("change", ev => { setStatus("switching architecture…"); postView("/api/view", { architecture: ev.target.value }, "architecture not changed"); });
  document.getElementById("adopt").addEventListener("click", () => postView("/api/view/adopt", {}, "treaty.yaml not switched"));
  document.getElementById("adopt-cancel").addEventListener("click", () => postView("/api/view", { architecture: live.state.view.configured }, "architecture not changed"));
  setInterval(tickAdopt, 1000);
  const events = new EventSource("/api/events");
  events.onmessage = ev => { const st = JSON.parse(ev.data); showState(st); if (st.version !== live.shown) refreshView(); };
  events.onerror = () => { const dot = document.getElementById("live-dot"); dot.classList.remove("on"); dot.title = "disconnected"; setStatus("disconnected from treaty; retrying…", true); };
}

buildLegend();
if (LIVE) startLive();
else { ingest(D); updateMeta(); buildQueue(); render(); selectFromHash(); }
</script>
