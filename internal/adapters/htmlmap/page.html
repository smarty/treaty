<html lang="en">
<head>

<title>Treaty</title>
<style>

}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; height: 100vh; }

.offer[hidden] { display: none; }

.offer .why { color: var(--muted); }
.offer .actions { display: flex; gap: 6px; }
/* Selection glows yellow and Claude's show requests glow teal. Both pulse

.file-arc { stroke-opacity: .45; }
.file-cell.file-hot, .file-cell.file-picked { stroke: var(--selection); stroke-width: 1.8; }
.file-arc.file-hot, .file-arc.file-picked { stroke: var(--selection); stroke-opacity: 1; }
[data-symbol].file-hot, [data-symbol].file-picked { filter: drop-shadow(0 0 2px var(--selection)); }
.selected-label { fill: var(--selection) !important; font-weight: 700; }
@media (prefers-reduced-motion: no-preference) {

}
header label, header button { font-size: 12px; color: var(--ink); }
button { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; color: var(--ink); }

.dock.bottom { flex-direction: row; height: var(--bottom, 240px); flex: none; }
.center-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

.splitter.col { width: 5px; cursor: col-resize; background: linear-gradient(var(--line), var(--line)) center / 1px 100% no-repeat; }

.splitter:hover, .splitter.dragging, .splitter:focus-visible { background: var(--focus); outline: none; }

.tab { font-size: 12px; padding: 4px 10px; border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; background: transparent; color: var(--muted); cursor: grab; white-space: nowrap; -webkit-user-select: none; user-select: none; touch-action: none; }
.tab.pinned { cursor: pointer; }
.tab.active { background: var(--panel); border-color: var(--line); color: var(--ink); }
.stack-body { flex: 1; min-height: 0; overflow: auto; position: relative; }
.stack-body.fill { overflow: hidden; }
.panel { padding: 12px; }
.map-panel { padding: 0; height: 100%; }
.map-panel .map-wrap { height: 100%; }
.float { position: absolute; z-index: 6; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 28px rgba(0,0,0,.35); overflow: hidden; }

.float-resize { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; background: linear-gradient(135deg, transparent 50%, var(--line) 50%); }

h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 4px 0 10px; }
.queue-item { display: grid; grid-template-columns: 22px 1fr; gap: 6px; padding: 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
.queue-item:hover { background: var(--bg); }
.queue-item.active { border-color: var(--focus); background: var(--bg); }
.queue-item .title { font-weight: 600; word-break: break-word; }
.queue-item .detail { color: var(--muted); font-size: 12px; word-break: break-word; }
.sev { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 11px; font-weight: 700; margin-top: 2px; }
.sev.high { background: var(--high); } .sev.medium { background: var(--medium); border-radius: 3px; } .sev.low { background: var(--low); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
#map { width: 100%; height: 100%; display: block; }
.map-wrap { position: relative; overflow: hidden; }
#panels { display: none; }
.glow { filter: drop-shadow(0 0 calc(3px * var(--u, 1)) var(--glow)) drop-shadow(0 0 calc(7px * var(--u, 1)) var(--glow)); }
.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; font: 12px/1.3 ui-monospace, "SF Mono", Menlo, monospace; box-shadow: 0 2px 8px rgba(0,0,0,.25); max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: none; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 32px; height: 32px; padding: 0; font-size: 16px; background: var(--panel); }
#map { cursor: grab; touch-action: none; } #map.panning { cursor: grabbing; }
/* Dragging pans the map; it must never select labels, legend text or tooltips. */
.map-wrap { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

#map :focus, #map :focus-visible { outline: none; }
.legend { position: absolute; left: 10px; top: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 11px; color: var(--muted); }
.legend svg { vertical-align: middle; }
.legend .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; vertical-align: -1px; }
.ring-label { font-size: 10px; fill: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.module-label { font-size: 10px; fill: var(--ink); pointer-events: none; }
.group { cursor: pointer; }
.group-name { font-size: 11px; font-weight: 600; fill: var(--muted); pointer-events: none; }
.group-count { font-size: 10px; fill: var(--muted); pointer-events: none; }
.module { cursor: pointer; }
.dim { opacity: .18; }
.inspector dl { display: grid; grid-template-columns: 90px 1fr; gap: 4px 8px; margin: 0 0 12px; font-size: 13px; }
.inspector dt { color: var(--muted); }
.inspector dd { margin: 0; word-break: break-word; }
pre { background: var(--code-bg); padding: 8px; border-radius: 6px; overflow: auto; font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; margin: 0 0 12px; }

pre.file { max-height: 60vh; }
li.link { cursor: pointer; text-decoration: underline dotted; }
.sig-old { color: var(--high); } .sig-new { color: var(--added); }

  body { height: auto; }

  .dock, .dock.bottom { height: auto; flex-direction: column; }

<body>
<header>
  <h1>Treaty</h1>
  <span class="meta" id="meta"></span>
  <span class="live" id="live" hidden>
    <span class="dot" id="live-dot" aria-hidden="true"></span>
    <label>Baseline <select id="baseline-mode"><option value="head">HEAD</option><option value="pr">Pull request</option><option value="ref">Ref</option></select></label>
    <input id="baseline-arg" type="text" size="16" spellcheck="false" aria-label="Baseline ref or target branch">
    <button id="baseline-apply" type="button">Apply</button>
    <label title="Preview the code in another architecture; treaty.yaml switches after 5 minutes or when you choose to use it">Architecture <select id="architecture"><option value="none">None</option><option value="hexagonal">Hexagonal</option><option value="clean">Clean</option><option value="layered">Layered</option><option value="slices">Vertical slices</option><option value="modular">Modular monolith</option></select></label>
    <span class="adopt" id="adopt-bar" role="status" hidden>treaty.yaml switches in <span id="adopt-countdown"></span> <button id="adopt" type="button">Use this architecture</button> <button id="adopt-cancel" type="button">Keep treaty.yaml</button></span>
    <span class="status" id="status" role="status"></span>
    <label title="When on, Claude's show requests move the view, but only while you are not using the map"><input type="checkbox" id="follow"> Follow Claude</label>
  </span>
  <span class="spacer"></span>
  <label><input type="checkbox" id="internals"> Show internals</label>
  <button id="layout-reset" type="button" title="Put every panel back in its drawer">Reset layout</button>
  <label>Theme <select id="theme"><option value="system">System</option></select></label>
</header>
<main id="workspace">
  <div class="dock" id="dock-left" data-dock="left"></div>
  <div class="splitter col" data-splitter="left" role="separator" aria-orientation="vertical" aria-label="Resize the left drawer" tabindex="0"></div>
  <div class="center-col">
    <div id="dock-center" data-dock="center"></div>
    <div class="splitter row" data-splitter="bottom" role="separator" aria-orientation="horizontal" aria-label="Resize the bottom drawer" tabindex="0"></div>
    <div class="dock bottom" id="dock-bottom" data-dock="bottom"></div>
  </div>
  <div class="splitter col" data-splitter="right" role="separator" aria-orientation="vertical" aria-label="Resize the right drawer" tabindex="0"></div>
  <div class="dock" id="dock-right" data-dock="right"></div>
  <div class="drop-hint" id="drop-hint" hidden></div>
</main>
<!-- Every panel lives here until the layout places it in a stack. -->
<div id="panels">
  <section class="panel" data-panel="queue" aria-label="Review queue"><div id="queue"></div></section>
  <section class="panel map-panel" data-panel="map" aria-label="Map">
  <div class="map-wrap">
    <svg id="map" role="application" aria-label="Hexagon map of modules and contracts"></svg>
    <div class="legend" id="legend"></div>
    <div class="tip" id="tip" role="tooltip"></div>
    <div class="offer" id="offer" role="status" aria-live="polite" hidden>
      <div><span class="who" id="offer-who"></span> <span id="offer-what"></span></div>
      <div class="why" id="offer-why"></div>
      <div class="actions"><button type="button" id="offer-go">Go</button><button type="button" id="offer-dismiss">Dismiss</button></div>
    </div>
    <div class="zoom" role="group" aria-label="Zoom">
      <button type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in (+)">+</button>
      <button type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out (−)">−</button>
      <button type="button" id="zoom-fit" aria-label="Fit to view" title="Fit (0)">⤢</button>
    </div>
  </div>
  </section>
  <section class="panel inspector" data-panel="inspector" aria-label="Inspector"><div id="inspector"><p class="empty">Select a module, file, symbol, edge or queue item.</p></div></section>
</div>
<script>
let D = /*DATA*/null;

const LIVE = D === null;
let modules, symbols, byModule, edges, links, groups, groupOf;
// ingest indexes one view. Everything drawn is derived from D and these maps.
function ingest(data) {
  D = data;
  for (const key of ["modules", "symbols", "edges", "links", "findings", "designs", "problems"]) D[key] = D[key] || [];

  symbols = new Map(D.symbols.map(s => [s.id, s]));

  for (const s of D.symbols) { if (!byModule.has(s.module)) byModule.set(s.module, []); byModule.get(s.module).push(s); }
  edges = D.edges; links = D.links;

  groupOf = new Map();
  for (const g of D.layout.groups || []) for (const id of g.modules) if (!groupOf.has(id) || groups.get(groupOf.get(id)).depth < g.depth) groupOf.set(id, g.id);

}
const NS = "http://www.w3.org/2000/svg";
const ICON_GROWTH = 0.4;
const inherits = kind => kind === "implements" || kind === "embeds";
const HIT_SLOP = 12;
const AUTO_COLLAPSE_PX = 45;
// A file cell shows its symbols once it is this many pixels across; smaller,
// the symbols stay on the module's border and the cells show only shading.
const CELL_DETAIL_PX = 20;
const LABEL_MIN_PX = 9;
const state = { pointer: null, selected: null, internals: false, symbolPos: new Map(), view: null, groupOpen: {}, signature: undefined, rendering: false };
const home = () => { const E = D.layout.extent + 20; return { x: -E, y: -E, w: 2 * E, h: 2 * E }; };

  // so they neither crowd each other nor vanish as the map grows.

  // fitted view however large the map is; icons stay tied to the geometry.

  const boost = Math.max(1, LABEL_MIN_PX / (10 * fitted));
  for (const node of svg.querySelectorAll("[data-ax]")) {
    const scale = (node.dataset.cap ? Math.min(partial, 1) : partial) * (node.dataset.text ? boost : 1);
    node.setAttribute("transform", `translate(${node.dataset.ax} ${node.dataset.ay}) scale(${scale})`);
  }

  sizeGlows();
  if (!state.rendering && state.signature !== undefined && typeof collapsedSignature === "function" && collapsedSignature() !== state.signature) render();
}
// sizeGlows gives each glowing element --u, one screen pixel in its own
// units, so its glow is the same size on screen at any zoom.
function sizeGlows() {
  for (const node of document.querySelectorAll("#map .selected-glow, #map .pointed-glow, #map .glow")) {
    const m = node.getScreenCTM && node.getScreenCTM();
    if (m) node.style.setProperty("--u", (1 / (Math.hypot(m.a, m.b) || 1)).toFixed(4));
  }
}
// anchored draws children around (0, 0) and scales them by only part of the

function anchored(parent, x, y, attrs = {}, cap = false, text = false) {

  if (cap) g.dataset.cap = "1";
  if (text) g.dataset.text = "1";
  return g;
}
function toMap(clientX, clientY) {
  const svg = document.getElementById("map"), point = svg.createSVGPoint(); point.x = clientX; point.y = clientY;
  return point.matrixTransform(svg.getScreenCTM().inverse());
}
function zoom(factor, center) {
  if (!D) return;
  const v = state.view, limit = home().w;
  const w = Math.min(limit * 3, Math.max(limit * 0.05, v.w * factor)), scale = w / v.w;
  const c = center || { x: v.x + v.w / 2, y: v.y + v.h / 2 };
  state.view = { x: c.x - (c.x - v.x) * scale, y: c.y - (c.y - v.y) * scale, w, h: v.h * scale };

function el(tag, attrs = {}, parent) {

  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
}

  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);

}

}

  if (ws.bottom - y < EDGE_ZONE) return { kind: "dock", side: "bottom", rect: strip("bottom") };

    const r = node.getBoundingClientRect();
    if (!inside(r)) continue;
    const where = node.where;
    if (where.side === "center") return node.stackRef === source ? null : { kind: "merge", stack: node.stackRef, rect: r };
    const vertical = where.side !== "bottom";
    const f = vertical ? (y - r.top) / r.height : (x - r.left) / r.width;
    const part = (from, to) => vertical ? { left: r.left, top: r.top + r.height * from, width: r.width, height: r.height * (to - from) } : { left: r.left + r.width * from, top: r.top, width: r.width * (to - from), height: r.height };

  if (target.kind === "merge") { target.stack.tabs.push(id); target.stack.active = id; }
  else if (target.kind === "split") dock[target.side].stacks.splice(target.index, 0, stack);
  else if (target.kind === "dock") dock[target.side].stacks.push(stack);
  else dock.floating.push({ ...stack, x: target.x, y: target.y, w: 320, h: 360 });

  // split index above still counted it.
  for (const side of SIDES) dock[side].stacks = dock[side].stacks.filter(s => s.tabs.length);

// stackSplitter resizes two neighboring stacks in a drawer.
function stackSplitter(side, index) {

  const resize = (delta) => {
    const a = node.previousElementSibling, b = node.nextElementSibling, stacks = dock[side].stacks;
    const size = el => vertical ? el.getBoundingClientRect().height : el.getBoundingClientRect().width;
    const total = size(a) + size(b), weights = stacks[index - 1].weight + stacks[index].weight;
    const first = Math.min(Math.max(size(a) + delta, STACK_MIN), total - STACK_MIN);

    track(e => { const now = vertical ? e.clientY : e.clientX; resize(now - last); last = now; layoutChanged(); }, () => { node.classList.remove("dragging"); saveLayout(); });

// The drawer splitters set each drawer's width, or the bottom one's height.
function resizeDrawer(side, size) {

  const most = side === "bottom" ? ws.height - CENTER_MIN / 2 : ws.width - others - CENTER_MIN;

for (const node of document.querySelectorAll("[data-splitter]")) {

    ev.preventDefault(); node.classList.add("dragging");
    track(e => { const ws = workspaceRect(); resizeDrawer(side, side === "left" ? e.clientX - ws.left : side === "right" ? ws.right - e.clientX : ws.bottom - e.clientY); }, () => { node.classList.remove("dragging"); saveLayout(); });
  });
  node.addEventListener("keydown", ev => {
    const grow = { left: { ArrowRight: 16, ArrowLeft: -16 }, right: { ArrowLeft: 16, ArrowRight: -16 }, bottom: { ArrowUp: 16, ArrowDown: -16 } }[side][ev.key];

let refit = 0;
function layoutChanged() {

}

window.addEventListener("resize", () => { if (dock.floating.length) renderLayout(); });

buildLegend();
if (LIVE) startLive();
else { ingest(D); updateMeta(); buildQueue(); render(); selectFromHash(); }
