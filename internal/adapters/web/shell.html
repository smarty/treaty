<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Treaty</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 1.5 28.6 8.75v14.5L16 30.5 3.4 23.25V8.75z' fill='%23005fb8'/><path d='M16 8.6 22.4 12.3v7.4L16 23.4 9.6 19.7v-7.4z' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linejoin='round'/><circle cx='16' cy='16' r='2.1' fill='%23fff'/></svg>">
<style>
/* The shell holds one tab per open project, each project's live map in its
   own frame. These tokens paint it until the shown map sends its theme. */
:root { --bg: #f8f8f8; --panel: #ffffff; --ink: #3b3b3b; --muted: #616161; --line: #e5e5e5; --accent: #005fb8; --focus: #005fb8; --claude: #267f99; --high: #e51400; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #181818; --panel: #1f1f1f; --ink: #cccccc; --muted: #9d9d9d; --line: #2b2b2b; --accent: #3794ff; --focus: #0078d4; --claude: #4ec9b0; --high: #f14c4c; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; height: 100vh; }
nav { display: flex; align-items: stretch; gap: 2px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
nav h1 { font-size: 15px; margin: 0 12px 0 0; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
nav h1 svg { width: 18px; height: 18px; }
/* Project tabs that overflow scroll sideways, with an arrow over each end
   that has more to see. */
.scroller { position: relative; display: flex; flex: 1; min-width: 0; }
.strip { display: flex; align-items: stretch; gap: 2px; flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; position: relative; }
.strip::-webkit-scrollbar { display: none; }
.scroll { position: absolute; top: 0; bottom: 0; z-index: 2; width: 26px; padding: 0; border: 0; font: inherit; font-size: 18px; line-height: 1; color: var(--muted); cursor: default; }
.scroll[hidden] { display: none; }
.scroll:hover { color: var(--ink); }
.scroll.back { left: 0; text-align: left; padding-left: 4px; background: linear-gradient(to right, var(--panel) 55%, transparent); }
.scroll.ahead { right: 0; text-align: right; padding-right: 4px; background: linear-gradient(to left, var(--panel) 55%, transparent); }
.tab { flex: none; font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px 6px; border-radius: 6px 6px 0 0; cursor: default; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; -webkit-user-select: none; user-select: none; touch-action: none; }
.tab:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 9%, transparent); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tab:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.tab .mark { width: 7px; height: 7px; border-radius: 50%; background: var(--claude); }
.tab .mark.new { background: var(--accent); }
.tab .mark[hidden] { display: none; }
/* Dragging a tab shows it under the pointer and a line where it would land. */
.ghost { position: fixed; z-index: 20; pointer-events: none; font-size: 13px; padding: 4px 10px; border-radius: 6px; background: var(--panel); color: var(--ink); border: 1px solid var(--focus); box-shadow: 0 4px 12px rgba(0,0,0,.3); }
.insert { position: fixed; z-index: 20; pointer-events: none; width: 3px; border-radius: 2px; background: var(--focus); }
.insert[hidden] { display: none; }
.status { align-self: center; font-size: 12px; color: var(--high); white-space: nowrap; padding-left: 12px; }
.status:empty { display: none; }
/* The theme and the layout apply to every project's map. */
.tools { display: flex; align-items: center; gap: 10px; padding-left: 12px; flex: none; font-size: 12px; white-space: nowrap; }
.tools select, .tools button { font: inherit; font-size: 12px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; cursor: default; }
.tools select { padding: 3px 6px; }
.tools button:hover:not(:disabled) { background: color-mix(in srgb, var(--ink) 9%, var(--bg)); }
.tools select:focus-visible, .tools button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.tools :disabled { opacity: .55; }
main { flex: 1; position: relative; min-height: 0; }
iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
/* A hidden map keeps its size, so it lays out right while out of sight. */
iframe[hidden] { display: block; visibility: hidden; }
.empty { padding: 24px; color: var(--muted); }
.empty[hidden] { display: none; }
</style>
</head>
<body>
<nav>
  <h1><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1.5 28.6 8.75v14.5L16 30.5 3.4 23.25V8.75z" fill="var(--accent)"/><path d="M16 8.6 22.4 12.3v7.4L16 23.4 9.6 19.7v-7.4z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><circle cx="16" cy="16" r="2.1" fill="#fff"/></svg>Treaty</h1>
  <div class="scroller">
    <button type="button" class="scroll back" id="scroll-back" tabindex="-1" aria-hidden="true" title="Scroll the projects left" hidden>‹</button>
    <div class="strip" id="tabs" role="tablist" aria-label="Open projects"></div>
    <button type="button" class="scroll ahead" id="scroll-ahead" tabindex="-1" aria-hidden="true" title="Scroll the projects right" hidden>›</button>
  </div>
  <span class="status" id="status" role="status"></span>
  <div class="tools">
    <label>Theme <select id="theme" disabled><option value="system">System</option></select></label>
    <button type="button" id="layout-reset" title="Put every panel of the shown map back in its drawer" disabled>Reset layout</button>
  </div>
</nav>
<div class="insert" id="insert" hidden></div>
<main id="frames">
  <p class="empty" id="empty">No project is open. Start Claude Code in a repository where treaty here has run, or run treaty serve there.</p>
</main>
<script>
// A tab per open project, in the order they opened until the person drags
// them into another, which this browser remembers. A project's frame loads
// the first time its tab is shown and stays loaded while the project is
// open, so switching back keeps where the person was. A project opened
// since the page loaded is marked until it is shown, and a hidden project
// whose agent points at something is marked the same way in Claude's color.
const LATEST = /*LATEST*/"";
const POLL_MS = 2000, DRAG_START = 5, ORDER_KEY = "treaty.projects.order";
const tabs = document.getElementById("tabs"), frames = document.getElementById("frames");
const open = new Map();
let active = "", firstList = true, wanted = new URLSearchParams(location.search).get("p") || "", hash = location.hash;
let order = [];
try { order = JSON.parse(localStorage.getItem(ORDER_KEY)) || []; } catch (err) { /* storage unavailable */ }

function frameURL(slug) { return "p/" + encodeURIComponent(slug) + "/"; }

function show(slug) {
  const project = open.get(slug);
  if (!project) return;
  active = slug;
  for (const [key, other] of open) {
    const on = key === slug;
    other.tab.setAttribute("aria-selected", on ? "true" : "false");
    other.tab.tabIndex = on ? 0 : -1;
    if (other.frame) other.frame.hidden = !on;
  }

  if (!project.frame) {
    project.frame = document.createElement("iframe");
    project.frame.title = project.info.name + " live map";
    project.frame.src = frameURL(slug) + hash;
    hash = "";
    frames.appendChild(project.frame);
  }

  project.mark.hidden = true;
  document.title = project.info.name + " · Treaty";
  history.replaceState(null, "", "?p=" + encodeURIComponent(slug));
  if (project.theme) paint(project.theme);
  fillTools();
  reveal(project.tab);
}

function add(info) {
  const tab = document.createElement("button"), mark = document.createElement("span"), label = document.createElement("span");
  tab.type = "button"; tab.className = "tab"; tab.setAttribute("role", "tab"); tab.title = info.root; tab.tabIndex = -1;
  mark.className = "mark new"; mark.hidden = firstList; mark.setAttribute("aria-label", "new");
  label.textContent = info.name;
  tab.append(mark, label);
  tab.addEventListener("click", ev => { show(info.slug); if (ev.detail > 0) open.get(info.slug).frame.focus(); });
  tab.addEventListener("pointerdown", ev => drag(ev, info.slug));
  tabs.appendChild(tab);
  open.set(info.slug, { info, tab, mark, frame: null, theme: null });
}

function remove(slug) {
  const project = open.get(slug);
  project.tab.remove();
  if (project.frame) project.frame.remove();
  open.delete(slug);
}

// sync matches the tabs to the open projects. When the shown project closes,
// the most recently opened one takes its place.
function sync(list) {
  const slugs = new Set(list.map(p => p.slug));
  for (const slug of [...open.keys()]) if (!slugs.has(slug)) remove(slug);
  for (const info of list) if (!open.has(info.slug)) add(info);
  arrange();
  firstList = false;
  document.getElementById("empty").hidden = open.size > 0;
  arrows();
  if (!open.size) { active = ""; document.title = "Treaty"; fillTools(); return; }
  if (open.has(active)) return;
  const choice = [wanted, LATEST].find(slug => open.has(slug)) || list[list.length - 1].slug;
  wanted = "";
  show(choice);
}

// arrange puts the tabs in the remembered order. Projects it has no place
// for keep the order they opened in, after the rest. Tabs already in order
// stay put, since moving a tab would take its focus.
function arrange() {
  const rank = slug => { const at = order.indexOf(slug); return at < 0 ? order.length : at; };
  const sorted = [...open].sort(([a], [b]) => rank(a) - rank(b));
  if (sorted.every(([, project], i) => tabs.children[i] === project.tab)) return;
  const focused = document.activeElement;
  open.clear();
  for (const [slug, project] of sorted) { open.set(slug, project); tabs.appendChild(project.tab); }
  if (focused && focused !== document.activeElement && tabs.contains(focused)) focused.focus();
}

// drag moves a project's tab to where it is dropped among the others. The
// new order goes first in the remembered one, ahead of closed projects.
function drag(ev, slug) {
  if (ev.button !== 0) return;
  const start = { x: ev.clientX, y: ev.clientY }, tab = open.get(slug).tab, line = document.getElementById("insert");
  const others = () => [...open.keys()].filter(key => key !== slug);
  let ghost = null, index = -1;
  const move = e => {
    if (!ghost) {
      if (Math.hypot(e.clientX - start.x, e.clientY - start.y) < DRAG_START) return;
      ghost = document.createElement("div");
      ghost.className = "ghost"; ghost.textContent = open.get(slug).info.name;
      document.body.appendChild(ghost);
    }
    Object.assign(ghost.style, { left: e.clientX + 12 + "px", top: e.clientY + 8 + "px" });
    nudge(e.clientX, e.clientY);
    const bar = tabs.getBoundingClientRect(), rest = others().map(key => open.get(key).tab.getBoundingClientRect());
    index = -1;
    if (e.clientY >= bar.top - 12 && e.clientY <= bar.bottom + 12) {
      index = rest.findIndex(r => e.clientX < r.left + r.width / 2);
      if (index < 0) index = rest.length;
      if ([...open.keys()].indexOf(slug) === index) index = -1;
    }
    line.hidden = index < 0;
    if (index < 0) return;
    const at = index < rest.length ? rest[index].left - 1 : rest.length ? rest[rest.length - 1].right + 1 : tab.getBoundingClientRect().left;
    Object.assign(line.style, { left: at - 1.5 + "px", top: bar.top + 4 + "px", height: bar.height - 8 + "px" });
  };
  const up = () => {
    window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up);
    if (!ghost) return;
    ghost.remove(); line.hidden = true;
    // The click that ends a drag must not also show the tab.
    const swallow = e => { e.stopPropagation(); window.removeEventListener("click", swallow, true); };
    window.addEventListener("click", swallow, true); setTimeout(() => window.removeEventListener("click", swallow, true), 0);
    if (index < 0) return;
    const slugs = others();
    slugs.splice(index, 0, slug);
    order = [...slugs, ...order.filter(key => !open.has(key))];
    try { localStorage.setItem(ORDER_KEY, JSON.stringify(order)); } catch (err) { /* storage unavailable */ }
    arrange();
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", up);
  window.addEventListener("pointercancel", up);
}

async function poll() {
  const status = document.getElementById("status");
  try {
    const response = await fetch("api/projects", { cache: "no-store" });
    if (!response.ok) throw new Error(response.statusText);
    sync(await response.json());
    status.textContent = "";
  } catch (err) {
    status.textContent = "treaty is not answering; retrying…";
  }

  setTimeout(poll, POLL_MS);
}

// The strip of project tabs scrolls sideways once they overflow it: the
// wheel scrolls it, an arrow at each end shows while there is more to see
// that way, dragging a tab near an end scrolls toward it, and the shown
// project's tab is kept in view.
const NUDGE_ZONE = 32, NUDGE_STEP = 12;
const back = document.getElementById("scroll-back"), ahead = document.getElementById("scroll-ahead");
function arrows() {
  back.hidden = tabs.scrollLeft <= 1;
  ahead.hidden = tabs.scrollLeft >= tabs.scrollWidth - tabs.clientWidth - 1;
}

function reveal(tab) {
  const left = tab.offsetLeft, right = left + tab.offsetWidth, room = 28;
  if (left < tabs.scrollLeft + room) tabs.scrollLeft = left - room;
  else if (right > tabs.scrollLeft + tabs.clientWidth - room) tabs.scrollLeft = right - tabs.clientWidth + room;
  arrows();
}

function nudge(x, y) {
  const r = tabs.getBoundingClientRect();
  if (y < r.top - 12 || y > r.bottom + 12) return;
  if (x < r.left + NUDGE_ZONE) tabs.scrollLeft -= NUDGE_STEP;
  else if (x > r.right - NUDGE_ZONE) tabs.scrollLeft += NUDGE_STEP;
}

for (const [button, step] of [[back, -1], [ahead, 1]]) {
  button.addEventListener("click", () => tabs.scrollBy({ left: step * Math.max(120, tabs.clientWidth * 0.75), behavior: "smooth" }));
}

tabs.addEventListener("scroll", arrows, { passive: true });
tabs.addEventListener("wheel", ev => {
  if (tabs.scrollWidth <= tabs.clientWidth || Math.abs(ev.deltaX) >= Math.abs(ev.deltaY)) return;
  ev.preventDefault();
  tabs.scrollLeft += ev.deltaMode === 1 ? ev.deltaY * 16 : ev.deltaY;
}, { passive: false });
if (typeof ResizeObserver === "function") new ResizeObserver(arrows).observe(tabs);

// The theme menu and Reset layout apply to the shown map, which passes the
// theme to the others. Each map tells its themes and the choice with its
// colors, so the menu lists the shown map's.
const themeMenu = document.getElementById("theme"), resetButton = document.getElementById("layout-reset");
function fillTools() {
  const project = open.get(active), theme = project && project.theme;
  resetButton.disabled = !project || !project.frame;
  themeMenu.disabled = !theme || !Array.isArray(theme.themes);
  if (themeMenu.disabled) return;
  const wanted = theme.themes.map(t => t.id + ":" + t.group).join("|");
  if (themeMenu.dataset.ids !== wanted) {
    themeMenu.textContent = "";
    themeMenu.appendChild(new Option("System", "system"));
    for (const [group, label] of Object.entries(theme.groups || {})) {
      const members = theme.themes.filter(t => t.group === group);
      if (!members.length) continue;
      const optgroup = document.createElement("optgroup");
      optgroup.label = label;
      for (const t of members) optgroup.appendChild(new Option(t.name, t.id));
      themeMenu.appendChild(optgroup);
    }

    themeMenu.dataset.ids = wanted;
  }

  themeMenu.value = theme.themes.some(t => t.id === theme.choice) ? theme.choice : "system";
}

function tellMap(message) {
  const project = open.get(active);
  if (project && project.frame) project.frame.contentWindow.postMessage(message, location.origin);
}

themeMenu.addEventListener("change", () => tellMap({ treatyShell: "theme", choice: themeMenu.value }));
resetButton.addEventListener("click", () => tellMap({ treatyShell: "reset-layout" }));

// paint takes the shown map's theme, so the tabs match it.
function paint(theme) {
  const root = document.documentElement;
  for (const name of ["bg", "panel", "ink", "muted", "line", "accent", "focus", "claude", "high"]) if (theme.colors[name]) root.style.setProperty("--" + name, theme.colors[name]);
  root.style.colorScheme = theme.base;
}

window.addEventListener("message", ev => {
  if (ev.origin !== location.origin || !ev.data || !ev.data.treaty) return;
  for (const [slug, project] of open) {
    if (!project.frame || project.frame.contentWindow !== ev.source) continue;
    if (ev.data.treaty === "theme") { project.theme = ev.data; if (slug === active) { paint(ev.data); fillTools(); } }
    if (ev.data.treaty === "offer" && slug !== active) { project.mark.classList.remove("new"); project.mark.setAttribute("aria-label", "Claude points at something"); project.mark.hidden = false; }
  }
});

tabs.addEventListener("keydown", ev => {
  const keys = [...open.keys()], at = keys.indexOf(active);
  let next = -1;
  if (ev.key === "ArrowRight") next = (at + 1) % keys.length;
  else if (ev.key === "ArrowLeft") next = (at - 1 + keys.length) % keys.length;
  else if (ev.key === "Home") next = 0;
  else if (ev.key === "End") next = keys.length - 1;
  if (next < 0 || !keys.length) return;
  ev.preventDefault();
  show(keys[next]);
  open.get(keys[next]).tab.focus();
});

// The browser's own menu never opens, as on every map, so a right click
// means only what Treaty's menus offer. Text fields keep theirs.
document.addEventListener("contextmenu", ev => { if (!(ev.target.closest && ev.target.closest("input, textarea"))) ev.preventDefault(); });

poll();
</script>
</body>
</html>
