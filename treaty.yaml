layers:
  composition: ["cmd/**"]
  domain:      ["internal/graph/**", "internal/rules/**", "internal/cml/**"]
  application: ["internal/app/**"]
  adapter:
    driving:   ["internal/adapters/cli/**", "internal/adapters/mcp/**", "internal/adapters/web/**"]
    driven:    ["internal/adapters/golang/**", "internal/adapters/filesystem/**", "internal/adapters/gitvcs/**", "internal/adapters/htmlmap/**"]
rules:
  fail_on: [breaking, layer_violation]
  warn_on: [unclassified]
